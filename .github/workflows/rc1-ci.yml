name: RC1 Integration Checks

on:
  pull_request:
  push:
    branches:
      - codex/rc1-repository-integration

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall src
      - run: PYTHONPATH=src pytest -q tests

  sqlite-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/scripts/rc1_sqlite_check.py

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recycleros_test
          POSTGRES_USER: recycleros
          POSTGRES_PASSWORD: recycleros_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r services/api/requirements.txt
      - run: python -m pip install -r services/api/requirements-postgres.txt
      - run: python tools/scripts/rc1_postgres_migrate.py
        env:
          DATABASE_URL: postgresql://recycleros:recycleros_test_password@localhost:5432/recycleros_test

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/recycleros_pro_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
